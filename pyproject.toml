[project]
name = "posttrade"
version = "0.1.0"
description = "Distributed post-trade reconciliation pipeline against a live public market data feed"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "redis>=5.0",
    "pydantic>=2.6",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
    "mypy>=1.9",
    "ruff>=0.4",
    "pandas-stubs>=2.2",
    "boto3-stubs[s3]>=1.34",
    "pyarrow-stubs>=17.0",
]
dataeng = [
    "boto3>=1.34",
    "pyarrow>=16.0",
    "polars>=1.0",
    "dbt-duckdb>=1.8",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "great-expectations>=0.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posttrade = ["py.typed"]
dataeng = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# great_expectations doesn't ship reliable type stubs and its Fluent API
# is dynamically constructed (crud methods registered at runtime), which
# defeats static analysis regardless of stub quality.
module = "great_expectations.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["posttrade", "dataeng"]
