services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: posttrade
      POSTGRES_PASSWORD: posttrade
      POSTGRES_DB: posttrade
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posttrade -d posttrade"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # The ingestor and workers run as host processes (not containers), so
    # Prometheus needs to reach back out to the host to scrape them.
    # host.docker.internal resolves automatically on Docker Desktop/OrbStack
    # (Mac/Windows); this extra_hosts entry is what makes it resolve on
    # Linux too, via Docker Compose's "host-gateway" special value
    # (Docker Engine >=20.10, i.e. effectively all current installs).
    # See README > Observability for details and the manual-IP fallback.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: posttrade
      MINIO_ROOT_PASSWORD: posttrade123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  timescale_data:
  minio_data:
