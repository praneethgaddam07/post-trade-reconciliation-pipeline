name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: posttrade
          POSTGRES_PASSWORD: posttrade
          POSTGRES_DB: posttrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posttrade -d posttrade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0
      TIMESCALE_DSN: postgresql://posttrade:posttrade@localhost:5432/posttrade

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy (src, strict)
        run: mypy src/

      - name: mypy (tests)
        run: mypy tests/

      - name: pytest
        run: pytest -v
