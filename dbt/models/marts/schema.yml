version: 2

models:
  - name: dim_symbol
    description: "One row per traded symbol."
    columns:
      - name: symbol
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: "One row per calendar date observed in the tick data."
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fct_ticks
    description: "Tick-grain fact table — one row per normalized exchange tick/match."
    columns:
      - name: tick_id
        description: "Surrogate key: symbol || '-' || sequence."
        data_tests:
          - not_null
          - unique
      - name: symbol
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_symbol')
                field: symbol
      - name: sequence
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
